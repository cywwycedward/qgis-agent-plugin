<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QGIS Processing 方法审计（3.44.13）</title>
<style>
  :root {
    --bg: #fbfbfc; --panel: #fff; --fg: #16181d; --muted: #667085; --line: #e6e8ec;
    --head: #f4f5f7; --hover: #eef2ff; --accent: #3355ff; --accent-soft: #e8ecff;
    --code: #111827; --ok: #0f7b52; --ok-soft: #e6f6ee; --empty: #6b7280; --empty-soft: #f1f2f4;
    --none: #a1450b; --none-soft: #fdf0e4; --args: #6d28d9; --args-soft: #f1ebff;
    --err: #b91c1c; --err-soft: #fdecec; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1016; --panel: #141922; --fg: #e6e9ef; --muted: #98a2b3; --line: #232a35;
      --head: #171d27; --hover: #1a2331; --accent: #7c9bff; --accent-soft: #1c2740;
      --code: #e6e9ef; --ok: #4ade80; --ok-soft: #12251c; --empty: #9aa4b2; --empty-soft: #1a1f27;
      --none: #fbbf24; --none-soft: #2a2213; --args: #c4b5fd; --args-soft: #221b36;
      --err: #f87171; --err-soft: #2a1618; --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    padding: 14px 20px 12px;
  }
  .title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .meta { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 8px; margin: 12px 0 10px; }
  .tab {
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px;
    display: flex; align-items: center; gap: 8px; transition: background .15s, border-color .15s;
  }
  .tab:hover { background: var(--hover); }
  .tab[aria-selected="true"] {
    border-color: var(--accent); background: var(--accent-soft); color: var(--accent);
    font-weight: 600;
  }
  .tab .count { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
  .tab[aria-selected="true"] .count { color: var(--accent); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .search { position: relative; flex: 1 1 300px; max-width: 460px; }
  .search input {
    width: 100%; padding: 8px 12px 8px 32px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); color: var(--fg); font: inherit; font-size: 13px;
  }
  .search input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .search svg { position: absolute; left: 10px; top: 9px; width: 14px; height: 14px; color: var(--muted); }
  select, button {
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  select:hover, button:hover { background: var(--hover); }
  button:disabled { opacity: .45; cursor: default; }
  .hint { color: var(--muted); font-size: 12px; }
  main { padding: 14px 20px 48px; }
  .summary { display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
             color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .summary strong { color: var(--fg); font-weight: 600; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  thead th {
    position: sticky; top: 118px; z-index: 6; background: var(--head);
    color: var(--muted); font-size: 11.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.entity { cursor: pointer; }
  tr.entity:hover td { background: var(--hover); }
  tr.entity.open td { background: var(--accent-soft); }
  .chev { display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
  tr.entity.open .chev { transform: rotate(90deg); color: var(--accent); }
  .name { font-weight: 600; }
  .name .pname { color: var(--muted); font-weight: 400; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px;
    border: 1px solid transparent; margin-right: 4px; white-space: nowrap;
  }
  .b0 { color: var(--ok); background: var(--ok-soft); }
  .b1 { color: var(--empty); background: var(--empty-soft); }
  .b2 { color: var(--none); background: var(--none-soft); }
  .b3 { color: var(--args); background: var(--args-soft); }
  .b4 { color: var(--err); background: var(--err-soft); }
  td.detail { padding: 0; background: var(--panel); border-bottom: 1px solid var(--line); }
  .methods {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1px; background: var(--line); border-top: 1px solid var(--line);
  }
  .method {
    background: var(--panel); padding: 8px 12px; min-height: 44px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .method .row1 { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .method .mname { font-weight: 600; font-size: 12.5px; }
  .method .value {
    color: var(--code); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 12px; word-break: break-word; white-space: pre-wrap; max-height: 7.5em; overflow: auto;
  }
  .method .value.clamped { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical;
                           overflow: hidden; cursor: zoom-in; }
  .method .value.open { -webkit-line-clamp: unset; cursor: zoom-in; }
  .method.empty-value .value { color: var(--muted); font-style: italic; }
  .pager { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  .pager .spacer { flex: 1; }
  .empty-state { color: var(--muted); padding: 28px 8px; text-align: center; }
  kbd { background: var(--head); border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 4px; padding: 0 5px; font-size: 11px; font-family: inherit; }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>QGIS Processing 方法审计</h1>
    <span class="meta" id="meta"></span>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-a" role="tab" aria-selected="true">算法 <span class="count" id="count-a"></span></button>
    <button class="tab" id="tab-p" role="tab" aria-selected="false">参数 <span class="count" id="count-p"></span></button>
  </div>
  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path>
      </svg>
      <input id="q" type="search" placeholder="搜索 算法 / 参数 / 方法 / 返回值（空格分隔 = 同时满足）"
             aria-label="搜索" autocomplete="off">
    </label>
    <select id="kind" aria-label="状态">
      <option value="">全部状态</option>
      <option value="0">含「有值」</option>
      <option value="1">含「空」</option>
      <option value="2">含「None」</option>
      <option value="3">含「需参数」</option>
      <option value="4">含「异常」</option>
    </select>
    <select id="method" aria-label="方法"><option value="">全部方法</option></select>
    <select id="provider" aria-label="Provider"><option value="">全部 Provider</option></select>
    <select id="ptype" aria-label="参数类型"><option value="">全部参数类型</option></select>
    <button id="expand" title="展开当前页的所有行">展开本页</button>
    <button id="collapse">全部收起</button>
    <button id="reset">重置</button>
  </div>
</header>
<main>
  <div class="summary" id="summary"></div>
  <table>
    <thead id="head"></thead>
    <tbody id="body"></tbody>
  </table>
  <div class="pager">
    <button id="prev">上一页</button>
    <button id="next">下一页</button>
    <span class="hint" id="pageinfo"></span>
    <span class="spacer"></span>
    <span class="hint">点任意行展开 / 收起 · 按 <kbd>/</kbd> 聚焦搜索 · <kbd>Esc</kbd> 清空</span>
  </div>
</main>
<script src="audit-data.js"></script>
<script>
"use strict";

const KIND_LABEL = ["有值", "空", "None", "需参数", "异常"];
const PAGE_SIZE = 50;
const DATA = window.AUDIT_DATA;

if (!DATA) {
  document.getElementById("summary").textContent =
    "缺少 audit-data.js：该文件是本地生成的审计数据，未入库。请用 QGIS 的 Python 重新生成后刷新本页。";
} else {
  init();
}

function init() {
  const d = DATA;
  const state = {
    tab: "a",
    page: 0,
    expanded: new Set(),
    view: [],
    query: [],
    kind: "",
    method: "",
    provider: "",
    type: "",
  };

  const algoRows = [];
  for (const [a, p, m, k, v] of d.aRows) {
    const entry = algoRows[a] || (algoRows[a] = {
      key: "a" + a, index: a, id: d.algos[a], provider: d.providers[p], methods: [],
    });
    entry.methods.push({ name: d.methodsA[m], kind: k, value: v, text: textOf(v) });
  }
  const paramMap = new Map();
  for (const [a, param, t, m, k, v] of d.pRows) {
    const key = a + "\u0000" + param;
    let entry = paramMap.get(key);
    if (!entry) {
      entry = {
        key: "p" + key, index: a, param, id: d.algos[a], type: d.types[t], methods: [],
      };
      paramMap.set(key, entry);
    }
    entry.methods.push({ name: d.methodsP[m], kind: k, value: v, text: textOf(v) });
  }
  const paramRows = [...paramMap.values()];

  for (const rows of [algoRows, paramRows]) {
    for (const entry of rows) {
      entry.counts = [0, 0, 0, 0, 0];
      for (const method of entry.methods) entry.counts[method.kind]++;
      entry.methods.sort((left, right) => left.name.localeCompare(right.name));
      entry.hay = [entry.id, entry.provider || "", entry.param || "", entry.type || "",
                   ...entry.methods.map((method) => method.name + " " + method.text)]
                  .join(" ").toLowerCase();
    }
  }

  const $ = (id) => document.getElementById(id);
  const esc = (text) => String(text);

  function textOf(value) {
    if (value === null) return "null";
    if (typeof value === "object") return JSON.stringify(value);
    return String(value);
  }

  function tokens(text) {
    return text.trim().toLowerCase().split(/\s+/).filter(Boolean);
  }

  function matches(tokens_, text) {
    for (const token of tokens_) if (!text.includes(token)) return false;
    return true;
  }

  function methodMatches(method, query, kind, name) {
    if (kind !== "" && method.kind !== Number(kind)) return false;
    if (name !== "" && method.name !== name) return false;
    if (!query.length) return true;
    return matches(query, (method.name + " " + method.text).toLowerCase());
  }

  function entityMatches(entry, query, kind, name, provider, type) {
    if (provider !== "" && entry.provider !== provider) return false;
    if (type !== "" && entry.type !== type) return false;
    if (kind !== "" && !entry.counts[Number(kind)]) return false;
    if (!query.length && name === "") return true;
    return entry.methods.some((method) => methodMatches(method, query, kind, name));
  }

  function currentSource() {
    return state.tab === "a" ? algoRows : paramRows;
  }

  function apply() {
    state.query = tokens($("q").value);
    state.kind = $("kind").value;
    state.method = $("method").value;
    state.provider = state.tab === "a" ? $("provider").value : "";
    state.type = state.tab === "p" ? $("ptype").value : "";
    state.view = currentSource().filter((entry) =>
      entityMatches(entry, state.query, state.kind, state.method, state.provider, state.type));
    state.page = 0;
    render();
  }

  function chips(counts) {
    const fragment = document.createDocumentFragment();
    for (let kind = 0; kind < 5; kind++) {
      if (!counts[kind]) continue;
      const badge = document.createElement("span");
      badge.className = "badge b" + kind;
      badge.textContent = KIND_LABEL[kind] + " " + counts[kind];
      fragment.appendChild(badge);
    }
    return fragment;
  }

  function methodCard(method, query, kind, name) {
    const visible = methodMatches(method, query, kind, name);
    const card = document.createElement("div");
    card.className = "method k" + method.kind + (method.text === "" || method.text === "null" ? " empty-value" : "");
    const head = document.createElement("div");
    head.className = "row1";
    const left = document.createElement("span");
    left.className = "mname mono";
    left.textContent = method.name;
    const right = document.createElement("span");
    right.className = "badge b" + method.kind;
    right.textContent = KIND_LABEL[method.kind];
    head.append(left, right);
    const value = document.createElement("div");
    value.className = "value" + (method.text.length > 160 ? " clamped" : "");
    value.textContent = method.text.length > 1200 ? method.text.slice(0, 1200) + " …" : method.text;
    value.addEventListener("click", (event) => {
      event.stopPropagation();
      value.classList.toggle("open");
      value.classList.toggle("clamped", false);
    });
    card.append(head, value);
    card.hidden = !visible;
    return card;
  }

  function detailRow(entry) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.className = "detail";
    td.colSpan = state.tab === "a" ? 4 : 5;
    const grid = document.createElement("div");
    grid.className = "methods";
    const cards = entry.methods.map((method) =>
      methodCard(method, state.query, state.kind, state.method));
    let shown = 0;
    for (const card of cards) { if (!card.hidden) shown++; grid.appendChild(card); }
    if (!shown) {
      const none = document.createElement("div");
      none.className = "method empty-value";
      none.textContent = "当前筛选下没有匹配的方法。";
      grid.appendChild(none);
    }
    td.appendChild(grid);
    tr.appendChild(td);
    return tr;
  }

  function render() {
    const isAlgorithm = state.tab === "a";
    $("head").replaceChildren(makeHead(isAlgorithm));

    const total = state.view.length;
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    state.page = Math.min(state.page, pages - 1);
    const start = state.page * PAGE_SIZE;
    const slice = state.view.slice(start, start + PAGE_SIZE);

    const body = $("body");
    body.replaceChildren();
    for (const entry of slice) {
      const tr = document.createElement("tr");
      tr.className = "entity";
      const open = state.expanded.has(entry.key);
      tr.classList.toggle("open", open);
      tr.dataset.key = entry.key;

      const cells = isAlgorithm
        ? [entry.id, entry.provider]
        : [entry.id, entry.param, entry.type];

      const focus = document.createElement("td");
      focus.className = "chev";
      focus.textContent = "▸";
      tr.appendChild(focus);

      for (const text of cells) {
        const td = document.createElement("td");
        if (text === entry.id) { td.className = "name mono"; td.textContent = text; }
        else if (text === entry.param) {
          td.className = "mono pname";
          td.textContent = text;
        } else td.textContent = text;
        tr.appendChild(td);
      }
      const counts = document.createElement("td");
      counts.replaceChildren(chips(entry.counts));
      tr.appendChild(counts);

      tr.addEventListener("click", () => {
        if (state.expanded.has(entry.key)) state.expanded.delete(entry.key);
        else state.expanded.add(entry.key);
        render();
      });
      body.appendChild(tr);
      if (open) body.appendChild(detailRow(entry));
    }

    if (!slice.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = isAlgorithm ? 4 : 5;
      td.className = "empty-state";
      td.textContent = "没有匹配的行。放宽搜索，或清空筛选。";
      tr.appendChild(td);
      body.appendChild(tr);
    }

    const summary = $("summary");
    summary.replaceChildren();
    const matched = document.createElement("strong");
    matched.textContent = total.toLocaleString();
    const totals = isAlgorithm ? algoRows.length : paramRows.length;
    summary.append(
      "匹配 ",
      matched,
      ` ${isAlgorithm ? "个算法" : "个参数"} / 共 ${totals.toLocaleString()} · ` +
        `每页 ${PAGE_SIZE} 行 · 点行展开`,
    );
    $("pageinfo").textContent = `第 ${state.page + 1} / ${pages} 页`;
    $("prev").disabled = state.page === 0;
    $("next").disabled = state.page + 1 >= pages;
  }

  function makeHead(isAlgorithm) {
    const tr = document.createElement("tr");
    const columns = isAlgorithm
      ? ["", "算法", "Provider", "方法状态"]
      : ["", "算法", "参数", "类型", "方法状态"];
    for (const label of columns) {
      const th = document.createElement("th");
      th.textContent = label;
      tr.appendChild(th);
    }
    return tr;
  }

  function fill(select, values) {
    const seen = new Set();
    for (const value of values) {
      if (seen.has(value)) continue;
      seen.add(value);
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    }
  }

  function switchTab(tab) {
    state.tab = tab;
    state.page = 0;
    $("tab-a").setAttribute("aria-selected", tab === "a");
    $("tab-p").setAttribute("aria-selected", tab === "p");
    $("provider").style.display = tab === "a" ? "" : "none";
    $("ptype").style.display = tab === "a" ? "none" : "";
    $("method").replaceChildren(new Option("全部方法", ""));
    fill($("method"), currentSource().flatMap((entry) => entry.methods.map((m) => m.name)));
    apply();
  }

  $("meta").textContent =
    `QGIS ${d.qgis} · ${d.algorithms} 个算法 · ${d.definitions} 个参数定义 · ` +
    `${(d.aRows.length + d.pRows.length).toLocaleString()} 条方法记录（只读调用）`;
  $("count-a").textContent = algoRows.length;
  $("count-p").textContent = paramRows.length;
  fill($("provider"), algoRows.map((entry) => entry.provider));
  fill($("ptype"), [...new Set(paramRows.map((entry) => entry.type))].sort());

  $("tab-a").addEventListener("click", () => switchTab("a"));
  $("tab-p").addEventListener("click", () => switchTab("p"));
  $("q").addEventListener("input", apply);
  for (const id of ["kind", "method", "provider", "ptype"]) $(id).addEventListener("input", apply);
  $("prev").addEventListener("click", () => { if (state.page > 0) { state.page--; render(); } });
  $("next").addEventListener("click", () => {
    const pages = Math.max(1, Math.ceil(state.view.length / PAGE_SIZE));
    if (state.page + 1 < pages) { state.page++; render(); }
  });
  $("expand").addEventListener("click", () => {
    const start = state.page * PAGE_SIZE;
    for (const entry of state.view.slice(start, start + PAGE_SIZE)) state.expanded.add(entry.key);
    render();
  });
  $("collapse").addEventListener("click", () => { state.expanded.clear(); render(); });
  $("reset").addEventListener("click", () => {
    $("q").value = "";
    $("kind").value = "";
    $("method").value = "";
    $("provider").value = "";
    $("ptype").value = "";
    state.expanded.clear();
    apply();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "/" && document.activeElement !== $("q")) {
      event.preventDefault();
      $("q").focus();
    }
    if (event.key === "Escape") {
      $("q").value = "";
      apply();
    }
  });

  switchTab("a");
}
</script>
</body>
</html>
